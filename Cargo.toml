[workspace]
resolver = "3"
members = [
  "crates/hirz-proto",
  "crates/hirz-crypto",
  "crates/hirz-sys",
  "crates/hirz-vault",
  "crates/hirz-ctap",
  "crates/hirz-webauthn",
  "crates/hirz-core",
  "crates/hirz-uv",
  "crates/hirz-session",
  "crates/hirzd",
  "crates/hirz-uhid-broker",
  "crates/hirz-nmh",
  "crates/hirz-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bakissation/hirz"
publish = false

[workspace.dependencies]
# Internal crates.
hirz-proto = { path = "crates/hirz-proto" }
hirz-crypto = { path = "crates/hirz-crypto" }
hirz-sys = { path = "crates/hirz-sys" }
hirz-vault = { path = "crates/hirz-vault" }
hirz-ctap = { path = "crates/hirz-ctap" }
hirz-webauthn = { path = "crates/hirz-webauthn" }
hirz-core = { path = "crates/hirz-core" }
hirz-uv = { path = "crates/hirz-uv" }
hirz-session = { path = "crates/hirz-session" }

# External crates. Every addition needs a line in docs/dependencies.md.
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
libc = { version = "0.2", default-features = false }
# Tool only: hirz-cli reads and writes FIDO CXF files. Never a dependency of hirzd or hirz-nmh.
serde_json = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = "symbols"
overflow-checks = true

[profile.dev]
panic = "abort"
overflow-checks = true
