
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[[exemptions.argon2]]
version = "0.6.0"
criteria = "safe-to-deploy"
notes = "argon2 family (RustCrypto), used by hirz-crypto for the PIN and backup passphrase KDF. These major versions are not covered by the imported audit sets yet. No cargo-vet audit recorded here; RustSec advisories through cargo deny."

[[exemptions.aws-lc-rs]]
version = "1.19.0"
criteria = "safe-to-deploy"
notes = "Crypto backend behind hirz-crypto (aws-lc-sys bundles the AWS-LC C library). Not covered by any imported audit set; too large to audit here. Relied on through upstream review and RustSec advisories (cargo deny)."

[[exemptions.aws-lc-sys]]
version = "0.47.0"
criteria = "safe-to-deploy"
notes = "Crypto backend behind hirz-crypto (aws-lc-sys bundles the AWS-LC C library). Not covered by any imported audit set; too large to audit here. Relied on through upstream review and RustSec advisories (cargo deny)."

