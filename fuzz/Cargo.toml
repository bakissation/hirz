[package]
name = "hirz-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# Not part of the main workspace and never shipped: libfuzzer-sys is allowed here only.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
hirz-proto = { path = "../crates/hirz-proto" }
hirz-crypto = { path = "../crates/hirz-crypto" }
hirz-core = { path = "../crates/hirz-core" }
hirz-ctap = { path = "../crates/hirz-ctap" }
hirz-webauthn = { path = "../crates/hirz-webauthn" }
hirz-vault = { path = "../crates/hirz-vault" }
hirz-uv = { path = "../crates/hirz-uv" }

[profile.release]
debug = 1
overflow-checks = true
debug-assertions = true

[lib]
name = "hirz_fuzz"
path = "src/lib.rs"
test = false
doc = false

[[example]]
name = "gen-seeds"
path = "examples/gen_seeds.rs"
test = false

[[bin]]
name = "cbor_strict"
path = "fuzz_targets/cbor_strict.rs"
test = false
doc = false
bench = false

