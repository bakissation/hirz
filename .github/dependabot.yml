# Keeps the commit-SHA pins of third-party actions current. Updates arrive as pull requests
# into dev, with the version comment next to each pin updated too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
