name: backmerge

# Started by hand (Actions, backmerge, Run workflow, branch main) when the back-merge after a
# release did not run: opens a main -> dev pull request with auto-merge (merge commit). After a
# release, the backmerge job of release-plz.yml does the same on its own.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backmerge:
    name: main into dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The App key lives in this environment, which only allows the main branch (docs/release.md).
    environment: release-plz
    env:
      HAS_APP: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' && vars.RELEASE_APP_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: GitHub App token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open and auto-merge the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: scripts/ci/backmerge.sh "$GITHUB_REPOSITORY"
