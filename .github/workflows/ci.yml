name: ci

# Every push to dev or main and every pull request into them; nothing is released from here. Branch
# protection requires the single check named "ci" (the last job), which passes only when every
# other job passed (docs/release.md).

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz:
        description: Run the fuzz smoke test instead of the regular checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  HIRZ_CHECK_STRICT: "1"
  # Nightly used by the fuzz job, pinned by date; change it in a reviewed change (docs/fuzzing.md).
  FUZZ_TOOLCHAIN: nightly-2026-11-12

jobs:
  lint:
    name: fmt, clippy, unsafe, dependencies, versions, pins, scripts
    if: github.event_name != 'schedule' && !inputs.fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: lint-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # The extension tests (node:test, no packages) run in the extension section of check.sh.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"

      - run: scripts/check.sh versions fmt clippy unsafe deps extension toolchain keys workflows scripts

  test:
    name: test (${{ matrix.arch }})
    if: github.event_name != 'schedule' && !inputs.fuzz
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: test-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - run: scripts/check.sh test

  supply-chain:
    name: cargo deny, cargo vet
    if: github.event_name != 'schedule' && !inputs.fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.20.2,cargo-vet@0.10.3

      - run: scripts/check.sh deny vet

  packages:
    name: packages
    if: github.event_name != 'schedule' && !inputs.fuzz
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 7

  # Advisories are published after a dependency was merged, so they are also checked every night.
  advisories:
    name: RustSec advisories (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.20.2

      - run: cargo deny --locked check advisories

  fuzz:
    name: fuzz smoke (60 s per target)
    if: github.event_name == 'schedule' || inputs.fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz@0.13.2 --locked

      - name: Smoke run
        env:
          FUZZ_SMOKE_SECONDS: "60"
          FUZZ_JOBS: "4"
        run: scripts/fuzz.sh smoke

      # Anyone signed in to GitHub can download the artifacts of a public repository, so a crashing
      # input is only kept encrypted to a maintainer key; without the variable nothing is uploaded.
      - name: Encrypt crashing inputs
        if: failure()
        env:
          RECIPIENT_KEY: ${{ vars.FUZZ_CRASH_GPG_PUBLIC_KEY }}
        run: |
          if [ -z "$RECIPIENT_KEY" ]; then
            echo "::warning::set the FUZZ_CRASH_GPG_PUBLIC_KEY variable to keep crashing inputs; none is uploaded without it (docs/fuzzing.md)"
            exit 0
          fi
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$RECIPIENT_KEY" | gpg --batch --quiet --import
          fpr=$(gpg --batch --with-colons --list-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          tar -C fuzz -cf - artifacts |
            gpg --batch --quiet --trust-model always --encrypt --recipient "$fpr" -o "$RUNNER_TEMP/fuzz-artifacts.tar.gpg"
          echo "ENCRYPTED=$RUNNER_TEMP/fuzz-artifacts.tar.gpg" >>"$GITHUB_ENV"

      - name: Keep the encrypted crashing inputs
        if: failure() && env.ENCRYPTED != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-encrypted
          path: ${{ env.ENCRYPTED }}
          retention-days: 30

  ci:
    name: ci
    if: always() && github.event_name != 'schedule' && !inputs.fuzz
    needs: [lint, test, supply-chain, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "::error::a required job ended with: $r"
              exit 1
            fi
          done
